      BUNNY_STREAM_LIBRARY_ID: 729782
      BUNNY_STREAM_HOSTNAME: iframe.mediadelivery.net
      BUNNY_STREAM_TOKEN_KEY: 76929048-0638-479f-b7ff-d80994254c52
      PUSHER_APP_ID: 2184522
      PUSHER_APP_KEY: 681f6fff3ba1a9c52fc3
      PUSHER_APP_SECRET: 81883f84d23de86a5f4c
      PUSHER_APP_CLUSTER: eu
    networks:
      - syrian_academy_network

  mysql:
    image: mysql:8.0
    container_name: syrian_academy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: syrian_academy
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - syrian_academy_network

  redis:
    image: redis:alpine
    container_name: syrian_academy_redis
    ports:
      - "6380:6379"
    networks:
      - syrian_academy_network

networks:
  syrian_academy_network:
    driver: bridge

volumes:
  mysql_data: