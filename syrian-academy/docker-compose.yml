      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ranimnahhas42@gmail.com
      MAIL_PASSWORD: "mcog tfjq pqxq kcay"
      MAIL_ENCRYPTION: tls
